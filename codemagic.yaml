workflows:
  # Development workflow - runs on every push to develop branch
  development:
    name: Development Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - env_vars # Add your environment variables group in Codemagic UI
      vars:
        FLUTTER_TEST_COVERAGE: true
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Run code analysis
        script: |
          flutter analyze
      - name: Run tests with coverage
        script: |
          flutter test --coverage
      - name: Check code formatting
        script: |
          dart format --set-exit-if-changed .
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
      - coverage/lcov.info

  # Production workflow - runs on push to main branch
  production-android:
    name: Production Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      groups:
        - env_vars
        - google_play # Add Google Play credentials
      vars:
        PACKAGE_NAME: "com.example.playground"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    scripts:
      - name: Set up key properties
        script: |
          echo "This is where you'd set up signing keys"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Run tests
        script: |
          flutter test
      - name: Build Android APK
        script: |
          flutter build apk --release
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - ronit.banerjee@herovired.com
        notify:
          success: true
          failure: true

  # iOS Production workflow
  production-ios:
    name: Production iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - env_vars
        - app_store_credentials # Add App Store credentials
      vars:
        BUNDLE_ID: "com.example.playground"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    scripts:
      - name: Set up code signing
        script: |
          echo "This is where you'd set up iOS signing"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Run tests
        script: |
          flutter test
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - ronit.banerjee@herovired.com
        notify:
          success: true
          failure: true

  # Pull Request workflow - runs on PRs
  pull-request-check:
    name: Pull Request Validation
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - env_vars
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Run code analysis
        script: |
          flutter analyze
      - name: Check code formatting
        script: |
          dart format --set-exit-if-changed .
      - name: Run all tests
        script: |
          flutter test --coverage
      - name: Build Android APK (debug)
        script: |
          flutter build apk --debug
    artifacts:
      - coverage/lcov.info
      - build/**/outputs/**/*.apk

  # Manual workflow for testing
  manual-test:
    name: Manual Test Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      groups:
        - env_vars
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'feature/*'
          include: true
        - pattern: 'bugfix/*'
          include: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Run tests
        script: |
          flutter test
      - name: Build Android Debug APK
        script: |
          flutter build apk --debug
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - ronit.banerjee@herovired.com
        notify:
          success: true
          failure: true
